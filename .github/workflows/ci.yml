name: Research metadata checks
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate claim metadata
        run: python tools/validate_claims.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
